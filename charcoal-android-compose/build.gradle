import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias libs.plugins.android.library
    alias libs.plugins.dokka
    alias libs.plugins.kotlin.compose
    alias libs.plugins.roborazzi
    id 'signing'
    id 'maven-publish'
}

group = "net.pixiv.charcoal"
version = findProperty('CHARCOAL_RELEASE_VERSION') ?: System.getenv('CHARCOAL_RELEASE_VERSION') ?: ""

android {
    compileSdk libs.versions.android.compileSdk.get().toInteger()

    buildFeatures {
        compose true
    }

    defaultConfig {
        minSdk libs.versions.android.minSdk.get().toInteger()

        aarMetadata {
            minCompileSdk = 37
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    namespace 'net.pixiv.charcoal.android.compose'

    testOptions {
        unitTests {
            // Robolectric が :charcoal-android のフォントなどのリソースを解決できるようにする
            includeAndroidResources = true
            all {
                // Roborazzi のスクリーンショット描画にはハードウェアレンダリングが必要
                it.systemProperty("robolectric.graphicsMode", "NATIVE")
                it.systemProperty("robolectric.pixelCopyRenderMode", "hardware")
                it.maxHeapSize = "4096m"
            }
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    api project(":charcoal-android")

    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling.preview
    // Android Studio の Preview 描画用。debug のみなので公開 POM には含まれない
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.material
    implementation libs.kotlinx.serialization.json

    testImplementation libs.junit

    // スクリーンショットテスト（Roborazzi）。詳細は README の「Screenshot test」を参照
    testImplementation libs.androidx.test.junit
    testImplementation libs.androidx.compose.ui.test.junit4
    testImplementation libs.robolectric
    testImplementation libs.roborazzi.core
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.junit.rule
    testImplementation libs.roborazzi.preview.scanner
    testImplementation libs.composable.preview.scanner

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
}

roborazzi {
    generateComposePreviewRobolectricTests.enable = true
    generateComposePreviewRobolectricTests.includePrivatePreviews = true
    generateComposePreviewRobolectricTests.packages = [android.namespace]
    generateComposePreviewRobolectricTests.robolectricConfig = [
        // Robolectric 4.16.1 が対応する最新の SDK（compileSdk 37 は未対応）
        "sdk": "[36]",
        "qualifiers": "RobolectricDeviceQualifiers.Pixel4a",
    ]
}

// record / compare / verifyRoborazzi 系タスク以外（通常の testDebugUnitTest など）では、
// 自動生成された Preview スクリーンショットテストを除外する。Robolectric のテストが毎回走るのを避けるため。
// Roborazzi 系タスクは専用の Test タスクを作らず testDebugUnitTest を再利用するため、
// タスク名ではなく CLI で指定されたタスク名から判定する。
def isRoborazziTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("roborazzi") }
if (!isRoborazziTask) {
    tasks.withType(Test).configureEach {
        useJUnit {
            excludeCategories "com.github.takahirom.roborazzi.RoborazziComposePreviewTestCategory"
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId group
                artifactId "charcoal-compose"
                version version

                pom {
                    name = "charcoal-compose"
                    description = "Design system library by pixiv"
                    url = "https://github.com/pixiv/charcoal-android"

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'kwzr'
                            name = 'Kazumasa Kawazure'
                            email = "kwzr@pixiv.co.jp"
                        }
                    }

                    scm {
                        connection = 'scm:git:github.com/pixiv/charcoal-android.git'
                        developerConnection = 'scm:git:ssh://github.com/pixiv/charcoal-android.git'
                        url = 'https://github.com/pixiv/charcoal-android/tree/main'
                    }
                }
            }
        }
    }
}

signing {
    sign publishing.publications
}

dokka {
    dokkaSourceSets.configureEach {
        enableAndroidDocumentationLink.set(true)
    }
}