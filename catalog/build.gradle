import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    alias libs.plugins.android.application
    alias libs.plugins.kotlin.compose
    alias libs.plugins.kotlin.parcelize
    alias libs.plugins.roborazzi
}

android {
    compileSdk libs.versions.android.compileSdk.get().toInteger()

    buildFeatures {
        viewBinding true
        compose true
    }

    defaultConfig {
        applicationId "net.pixiv.charcoal.android.catalog"
        minSdk libs.versions.android.minSdk.get().toInteger()
        targetSdk libs.versions.android.targetSdk.get().toInteger()
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    namespace 'net.pixiv.charcoal.android.catalog'

    testOptions {
        unitTests {
            // Robolectric が catalog と依存モジュールのフォントなどのリソースを解決できるようにする
            includeAndroidResources = true
            all {
                // Roborazzi のスクリーンショット描画にはハードウェアレンダリングが必要
                it.systemProperty("robolectric.graphicsMode", "NATIVE")
                it.systemProperty("robolectric.pixelCopyRenderMode", "hardware")
                it.maxHeapSize = "4096m"
                // JDK 17 以降で Robolectric が JDK の内部 API にアクセスできるようにする。
                // 内容は Robolectric の推奨設定（https://robolectric.org/getting-started/）と同じ
                it.jvmArgs(
                    "--add-opens=java.base/java.lang=ALL-UNNAMED",
                    "--add-opens=java.base/java.util=ALL-UNNAMED",
                    "--add-opens=java.base/java.io=ALL-UNNAMED",
                    "--add-opens=java.base/java.net=ALL-UNNAMED",
                    "--add-opens=java.base/java.security=ALL-UNNAMED",
                    "--add-opens=java.base/java.text=ALL-UNNAMED",
                    "--add-opens=java.base/jdk.internal.access=ALL-UNNAMED",
                    "--add-opens=java.desktop/java.awt.font=ALL-UNNAMED",
                    "--add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED",
                )
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
        // M3 の Experimental API（TopAppBar 等）をモジュール単位で opt-in する。
        optIn.add("androidx.compose.material3.ExperimentalMaterial3Api")
    }
}

repositories {
    maven { url "https://www.jitpack.io" }
}

dependencies {
    implementation project(':charcoal-android')
    implementation project(':charcoal-android-compose')

    implementation libs.androidx.appcompat
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons
    implementation libs.androidx.recyclerview
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.groupie
    implementation libs.groupie.viewbinding
    implementation libs.viewbinding.ktx

    testImplementation libs.junit

    // スクリーンショットテスト（Roborazzi）。詳細は README の「Screenshot test」を参照
    testImplementation libs.androidx.test.junit
    testImplementation libs.androidx.compose.ui.test.junit4
    testImplementation libs.robolectric
    testImplementation libs.roborazzi.core
    testImplementation libs.roborazzi.compose
    testImplementation libs.roborazzi.junit.rule
    testImplementation libs.roborazzi.preview.scanner
    testImplementation libs.composable.preview.scanner

    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
}

roborazzi {
    generateComposePreviewRobolectricTests.enable = true
    generateComposePreviewRobolectricTests.includePrivatePreviews = true
    generateComposePreviewRobolectricTests.packages = [android.namespace]
    generateComposePreviewRobolectricTests.robolectricConfig = [
        // charcoal-android-compose と揃える
        "sdk": "[36]",
        "qualifiers": "RobolectricDeviceQualifiers.Pixel4a",
    ]
}

// record / compare / verifyRoborazzi 系タスク以外では自動生成された Preview スクリーンショットテストを除外する。
// 理由と判定方法は charcoal-android-compose/build.gradle を参照
def isRoborazziTask = gradle.startParameter.taskNames.any { it.toLowerCase().contains("roborazzi") }
if (!isRoborazziTask) {
    tasks.withType(Test).configureEach {
        useJUnit {
            excludeCategories "com.github.takahirom.roborazzi.RoborazziComposePreviewTestCategory"
        }
    }
}