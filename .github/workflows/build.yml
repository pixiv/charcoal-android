name: build

on: pull_request

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'adopt'
          cache: gradle

      - name: Build catalog app
        run: ./gradlew :catalog:assembleDebug

      - name: Run ktlintCheck
        run: ./gradlew ktlintCheck
